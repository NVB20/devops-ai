# Step 08: test every pull request and push, and publish the chatbot image to GHCR from main.
#   test    – the tests of steps 06, 07 and 09 against a real Postgres + pgvector, after a real ingest
#   configs – compose files, Prometheus config and alert rules, Kubernetes manifests
#   image   – builds the latest step's image; on main it's pushed as ghcr.io/<owner>/devops-ai-app:{latest,sha-xxxxxxx}
# See 08-CICD/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The step whose image is built and deployed (Kubernetes runs it in step 10)
  APP_STEP: 09-Monitoring

jobs:
  test:
    name: test (${{ matrix.step }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        step: [06-Deploy, 07-n8n-Ollama, 09-Monitoring]
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d knowledge"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://devops:devops@127.0.0.1:5432/knowledge
      # The app builds its LLM client at import. The tests replace it with a fake, so no real key is needed.
      OPENROUTER_API_KEY: ci-not-a-real-key
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    defaults:
      run:
        working-directory: ${{ matrix.step }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.step }}/app/requirements.txt

      # The embedding model (~90 MB), downloaded once and reused by the next runs
      - uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-all-MiniLM-L6-v2

      - name: Install
        run: python -m pip install -r app/requirements.txt

      - name: Load the runbooks into Postgres
        run: python -m app.ingest

      # test_retrieval.py runs for real here: the database is up and holds the runbooks
      - name: Tests
        run: python -m pytest tests -v -p no:cacheprovider

  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose files (every step's stack)
        env:
          OPENROUTER_API_KEY: x
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f 07-n8n-Ollama/compose.yml config --quiet
          docker compose -f docker-compose.yml -f 07-n8n-Ollama/compose.yml -f 09-Monitoring/compose.yml config --quiet

      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/09-Monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:latest check config /etc/prometheus/prometheus.yml

      - name: Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/10-Kubernetes:/k8s:ro" ghcr.io/yannh/kubeconform:latest \
            -strict -summary /k8s/manifests

  image:
    needs: [test, configs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR with the built-in GITHUB_TOKEN, no extra secret
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase: metadata-action lowercases the owner (NVB20 -> nvb20)
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-ai-app
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Pull requests build the image to prove it builds; only main pushes it
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.APP_STEP }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
