# Every alert goes two ways:
#   - straight to a second Discord channel (raw alert, no AI), so alerts still arrive when n8n is down
#   - to n8n's alert workflow, which asks the chatbot what to do and posts error + fix to the main channel
# Alerts are grouped by name: one message per alert name every 4 hours at most, not one per scrape.
route:
  receiver: n8n
  group_by: [alertname]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: discord-raw
      continue: true  # keep going, so the n8n route gets it too
    - receiver: n8n

receivers:
  - name: n8n
    webhook_configs:
      - url: http://n8n:5678/webhook/devops-ai-alert
        send_resolved: false  # only "it broke", not "it's fixed"

  - name: discord-raw
    discord_configs:
      # Alertmanager can't read env vars in its config; the compose entrypoint writes the URL here
      - webhook_url_file: /tmp/discord-fallback-url
        send_resolved: true  # the raw channel also says when it's fixed
