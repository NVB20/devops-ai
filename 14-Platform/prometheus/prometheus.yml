# Step 09's scrape of the chatbot, plus Postgres, n8n and Alertmanager, and alerts sent to Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: devops-ai
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ["n8n:5678"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
