# Step 09 on top of steps 06 and 07: the step 09 app (with /metrics), Prometheus and Grafana.
# Run from the repo root:
#   docker compose -f docker-compose.yml -f 07-n8n-Ollama/compose.yml -f 09-Monitoring/compose.yml up -d --build
# Relative paths below are relative to the repo root (the first file's folder), not to this file.

x-step09: &step09
  build:
    context: .
    dockerfile: 09-Monitoring/Dockerfile
  image: devops-ai-app:09

services:
  ingest:
    <<: *step09

  app:
    <<: *step09

  prometheus:
    image: prom/prometheus:latest
    container_name: devops-ai-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./09-Monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: devops-ai-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/devops-ai.json
    volumes:
      - ./09-Monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./09-Monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  promdata:
  grafanadata:
