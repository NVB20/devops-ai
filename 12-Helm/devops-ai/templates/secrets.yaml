{{- if not .Values.database.existingSecret }}
# DATABASE_URL for the app and the ingest: the in-cluster Postgres, or database.url
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-ai.databaseSecret" . }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "devops-ai.databaseUrl" . | quote }}
{{- end }}
{{- if .Values.llm.openrouterApiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-ai.openrouterSecret" . }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENROUTER_API_KEY: {{ .Values.llm.openrouterApiKey | quote }}
{{- end }}
