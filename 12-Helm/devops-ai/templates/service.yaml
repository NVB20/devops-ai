apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-ai.fullname" . }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "devops-ai.selectorLabels" (dict "component" "app" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
