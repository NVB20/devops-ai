# The chart on Floci's EKS (step 11). ArgoCD deploys it (13-ArgoCD/apps/devops-ai-floci.yaml) with
# these values, then 13-ArgoCD/values-argocd.yaml (the GHCR image CI built) and values-argocd-floci.yaml
# (the Secrets 12-Helm/floci made: the RDS URL and the OpenRouter key).
image:
  repository: localhost:4566/000000000000/us-east-1/devops-ai-app  # Floci's ECR, if you install by hand
  pullPolicy: IfNotPresent

runtimeLabel: floci-eks

postgres:
  enabled: false  # the database is RDS

service:
  type: ClusterIP  # the cluster's ports aren't published; reach it with kubectl port-forward
