# Postgres + pgvector for the RAG knowledge base (stage 2)
# Start: docker compose up -d    Stop: docker compose down    Wipe data: docker compose down -v
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: devops-ai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    ports:
      - "127.0.0.1:5435:5432" # 5432-5434 are taken on this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
