<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps AI Chatbot</title>
  <style>
    :root {
      --bg: #f4f5f7; --panel: #ffffff; --text: #1d2129; --muted: #6b7280;
      --user: #2563eb; --user-text: #ffffff; --bot: #eef0f3; --border: #e3e5e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --panel: #171a21; --text: #e6e8eb; --muted: #9aa1ab;
        --user: #3b82f6; --user-text: #ffffff; --bot: #232731; --border: #2a2f3a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .chat {
      width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column;
      background: var(--panel); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    header h1 { margin: 0; font-size: 17px; }
    header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .msg.thinking { color: var(--muted); font-style: italic; }
    .msg small { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
    .msg.error { align-self: center; max-width: 95%; color: #dc2626; font-size: 13px; }
    form { display: flex; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--border); }
    input {
      flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font: inherit;
    }
    input:focus { outline: 2px solid var(--user); outline-offset: -1px; }
    button {
      padding: 0 18px; border: 0; border-radius: 10px; background: var(--user);
      color: var(--user-text); font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>DevOps AI Chatbot</h1>
      <p>Step 2 &middot; AI answers via OpenRouter</p>
    </header>
    <div id="messages" aria-live="polite"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Ask a DevOps question..." required>
      <button id="send">Send</button>
    </form>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function addMessage(text, kind, note) {
      const el = document.createElement("div");
      el.className = "msg " + kind;
      el.textContent = text;
      if (note) {
        const small = document.createElement("small");
        small.textContent = note;
        el.appendChild(small);
      }
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      send.disabled = true;
      const thinking = addMessage("Thinking...", "bot thinking");
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "Server returned " + res.status);
        thinking.remove();
        addMessage(data.answer, "bot", data.model);
      } catch (err) {
        thinking.remove();
        addMessage("Error: " + err.message, "error");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.focus();
  </script>
</body>
</html>
