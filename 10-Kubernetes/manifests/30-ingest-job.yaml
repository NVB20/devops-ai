# Loads the runbooks into Postgres, then exits. While Postgres is still starting it fails, and the Job retries it.
# To load them again: kubectl -n devops-ai delete job ingest, then apply this file again.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
  namespace: devops-ai
  labels:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/part-of: devops-ai
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest
        app.kubernetes.io/part-of: devops-ai
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # the image's chatbot user; numeric, so the kubelet can check it isn't root
      containers:
        - name: ingest
          image: devops-ai-app:09
          imagePullPolicy: IfNotPresent  # loaded into kind with `kind load docker-image`
          command: ["python", "-m", "app.ingest"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
